<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="NeX-Agent - AI Agent CLI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a17"/>
      <stop offset="1" stop-color="#14302a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9e6d3"/>
      <stop offset="1" stop-color="#7fc4a8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#7fc4a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7fc4a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow)"/>

  <!-- Logo -->
  <g transform="translate(70,60)">
    <rect width="120" height="120" rx="26" fill="#0d211d" stroke="url(#accent)" stroke-width="4"/>
    <path d="M38 40 L68 60 L38 80" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="76" y="76" width="26" height="9" rx="4" fill="url(#accent)"/>
  </g>

  <!-- Judul -->
  <text x="225" y="125" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="url(#accent)">NeX-Agent</text>
  <text x="228" y="170" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c9ddd5">Agent terminal dengan mode Plan &amp; Build</text>

  <!-- Chip -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e4f2ec">
    <rect x="228" y="200" width="130" height="36" rx="18" fill="#183a33" stroke="#2f5a4e"/>
    <text x="293" y="223" text-anchor="middle">TypeScript</text>
    <rect x="373" y="200" width="110" height="36" rx="18" fill="#183a33" stroke="#2f5a4e"/>
    <text x="428" y="223" text-anchor="middle">Node 20+</text>
    <rect x="498" y="200" width="150" height="36" rx="18" fill="#183a33" stroke="#2f5a4e"/>
    <text x="573" y="223" text-anchor="middle">Termux ready</text>
  </g>

  <!-- Jendela terminal -->
  <g>
    <rect x="770" y="45" width="380" height="230" rx="14" fill="#08130f" stroke="#24453d"/>
    <circle cx="795" cy="70" r="6" fill="#e07a7a"/>
    <circle cx="815" cy="70" r="6" fill="#e6c27a"/>
    <circle cx="835" cy="70" r="6" fill="#7fc4a8"/>
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15">
      <text x="795" y="112" fill="#e4f2ec"><tspan fill="#b9e6d3">$</tspan> nex-agent --mode plan</text>
      <text x="795" y="141" fill="#8fb3a6"><tspan fill="#7fc4a8">+</tspan> membaca src/core/loop.ts</text>
      <text x="795" y="170" fill="#8fb3a6"><tspan fill="#7fc4a8">+</tspan> menyusun rencana (3 langkah)</text>
      <text x="795" y="199" fill="#8fb3a6"><tspan fill="#e6c27a">~</tspan> diff siap, menunggu konfirmasi</text>
      <text x="795" y="236" fill="#e4f2ec"><tspan fill="#b9e6d3">&gt;</tspan> [PLAN] /build<tspan fill="#b9e6d3">█</tspan></text>
    </g>
  </g>
</svg>
